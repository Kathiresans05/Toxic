apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: expert-ingress
  namespace: expert-platform
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  rules:
    - host: api.expertapp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: expert-backend-svc
                port:
                  number: 8080
    - host: admin.expertapp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: expert-admin-svc
                port:
                  number: 80
