apiVersion: apps/v1
kind: Deployment
metadata:
  name: expert-backend
  namespace: expert-platform
  labels:
    app: expert-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: expert-backend
  template:
    metadata:
      labels:
        app: expert-backend
    spec:
      containers:
        - name: backend
          image: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/expert-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: expert-backend-config
            - secretRef:
                name: expert-backend-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: expert-backend-svc
  namespace: expert-platform
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: expert-backend
