apiVersion: v1
kind: Namespace
metadata:
  name: expert-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: expert-backend-config
  namespace: expert-platform
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  DATABASE_URL: "jdbc:postgresql://postgres.expert-platform.svc.cluster.local:5432/expert_db"
  DATABASE_USERNAME: "postgres"
  REDIS_HOST: "redis.expert-platform.svc.cluster.local"
  REDIS_PORT: "6379"
  AWS_REGION: "ap-south-1"
  AWS_S3_BUCKET: "expert-app-media-prod"
---
apiVersion: v1
kind: Secret
metadata:
  name: expert-backend-secrets
  namespace: expert-platform
type: Opaque
stringData:
  DATABASE_PASSWORD: "CHANGE_IN_PRODUCTION_PASSWORD"
  JWT_SECRET: "dGhpc0lzQVZlcnlTZWN1cmVKd3RTZWNyZXRLZXlXaGljaElzQXRMZWFzdDI1NkJpdHNMb25nMTIzNDU2Nzg5MA=="
  AGORA_APP_ID: "YOUR_PROD_AGORA_APP_ID"
  AGORA_APP_CERTIFICATE: "YOUR_PROD_AGORA_APP_CERTIFICATE"
  RAZORPAY_KEY_ID: "rzp_live_PROD_KEY"
  RAZORPAY_KEY_SECRET: "rzp_live_PROD_SECRET"
  RAZORPAY_WEBHOOK_SECRET: "rzp_webhook_secret_key"
