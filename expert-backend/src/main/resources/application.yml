server:
  port: 8080

spring:
  application:
    name: expert-backend-spring
  profiles:
    active: dev

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/expert_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      fail-on-empty-beans: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:flowing-gibbon-198025.upstash.io}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:gQAAAAAAAwWJAAIgcDJjMmU3ZDhmMmZhNGQ0NWI5YjNjZGVmZjE0ZTYyYmMxMw}
      ssl:
        enabled: ${REDIS_SSL:true}
      timeout: 5000ms

# JWT Security Configuration
app:
  jwt:
    secret: ${JWT_SECRET:dGhpc0lzQVZlcnlTZWN1cmVKd3RTZWNyZXRLZXlXaGljaElzQXRMZWFzdDI1NkJpdHNMb25nMTIzNDU2Nzg5MA==}
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days

  # Agora RTC Configuration
  agora:
    app-id: ${AGORA_APP_ID:c9afe369772c48659610c8b6368df693}
    app-certificate: ${AGORA_APP_CERTIFICATE:dbc1ada8600e4541b18e42cd8542eddc}
    token-expiration-in-seconds: 3600

  # Payment Gateways (Razorpay / Cashfree)
  payment:
    provider: ${PAYMENT_PROVIDER:razorpay}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
      key-secret: ${RAZORPAY_KEY_SECRET:rzp_secret_placeholder}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:rzp_webhook_secret}
    cashfree:
      app-id: ${CASHFREE_APP_ID:}
      secret-key: ${CASHFREE_SECRET_KEY:}
      api-version: "2023-08-01"

  # Firebase Cloud Messaging
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}

  # AWS S3 Storage
  aws:
    s3:
      bucket-name: ${AWS_S3_BUCKET:expert-app-media}
      region: ${AWS_REGION:us-east-1}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}

# Actuator & Prometheus Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

# OpenAPI / Swagger Config
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
