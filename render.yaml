databases:
  - name: expert-db
    databaseName: expert_db
    user: expert_user
    plan: free
    region: singapore

services:
  - type: web
    name: expert-backend
    runtime: docker
    dockerfilePath: ./expert-backend/Dockerfile
    dockerContext: ./expert-backend
    plan: free
    region: singapore
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: expert-db
          property: connectionString
      - key: AGORA_APP_ID
        value: c9afe369772c48659610c8b6368df693
      - key: AGORA_APP_CERTIFICATE
        value: dbc1ada8600e4541b18e42cd8542eddc
      - key: JWT_SECRET
        generateValue: true

